version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: komga-postgres
    environment:
      POSTGRES_DB: komga
      POSTGRES_USER: komga
      POSTGRES_PASSWORD: komga123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U komga" ]
      interval: 10s
      timeout: 5s
      retries: 5

  komga:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: komga-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KOMGA_DATABASE_TYPE: postgresql
      KOMGA_DATABASE_URL: jdbc:postgresql://postgres:5432/komga?connectTimeout=30000&socketTimeout=60000
      KOMGA_DATABASE_USERNAME: komga
      KOMGA_DATABASE_PASSWORD: komga123
      KOMGA_CONFIG_DIR: /config
      KOMGA_DATABASE_POOL_SIZE: 10
      KOMGA_DATABASE_MAX_POOL_SIZE: 10
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "20250730173126"
    ports:
      - "25600:25600"
    volumes:
      - komga_config:/config
      - /Users/duong/Documents/data-komga:/data:ro
    restart: unless-stopped

  smart-scanner:
    build:
      context: ./scan-library-tool
      dockerfile: Dockerfile
    container_name: komga-smart-scanner
    depends_on:
      postgres:
        condition: service_healthy
      komga:
        condition: service_started
    ports:
      - "5050:5050"
    environment:
      KOMGA_BASE_URL: http://komga:25600
      KOMGA_USER: admin@example.com
      KOMGA_PASSWORD: ""
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: komga
      PG_USER: komga
      PG_PASSWORD: komga123
      DRY_RUN: "false"
      PORT: "5050"
      SCAN_THREADS: ${SCAN_THREADS:-0}
      HASH_CACHE_DIR: /exports
      HASHER_THREADS: "4"
    volumes:
      - /Users/duong/Documents/data-komga:/data:ro
      - ./exports:/exports

volumes:
  postgres_data:
  komga_config:
