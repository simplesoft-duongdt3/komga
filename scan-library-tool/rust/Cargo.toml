[package]
name = "komga-smart-scanner"
version = "1.0.0"
edition = "2021"
description = "External diff-based scanner for Komga — PDF-only, reads PostgreSQL + filesystem, drives REST API"

[[bin]]
name = "komga-smart-scanner"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
walkdir = "2"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
url = "2"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
# memmap2 is used by the hasher
memmap2 = "0.9"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
